<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Title</title>
        <style>
/* dark background like your screenshot */
body{
  background: radial-gradient(1200px 700px at 50% 30%, #1a2a3f 0%, #0b1424 55%, #071020 100%);
}

/* the white rounded card */
.roleCard{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;

  width:min(980px, 92vw);
  padding:26px 34px;

  background:#ffffff;
  border-radius:34px;

  /* soft shadow */
  box-shadow:
    0 18px 40px rgba(0,0,0,.25),
    0 2px 0 rgba(0,0,0,.03);
}

/* left side */
.roleLeft{
  display:flex;
  align-items:center;
  gap:22px;
}

/* outline icon */
.roleIcon{
  width:54px;
  height:54px;
  color:#a3a3a3; /* light gray like screenshot */
  display:grid;
  place-items:center;
}

.roleIcon svg{
  width:100%;
  height:100%;
}

/* username */
.roleName{
  font-size:44px;
  font-weight:600;
  color:#8a8a8a;          /* muted gray text */
  letter-spacing:.2px;
}

/* right pill */
.rolePill{
  min-width:220px;
  text-align:center;

  font-size:40px;
  font-weight:600;

  padding:18px 28px;
  border-radius:18px;

  border:4px solid transparent;
  background:transparent;
}

/* VIEWER style (gray pill) */
.rolePill.is-viewer{
  color:#7b7b7b;
  background:#eeeeee;
  border-color:#9a9a9a;
}

/* EDITOR style (gold pill) */
.rolePill.is-editor{
  color:#c49a2d;
  background:#efe1bd;
  border-color:#e0c88c;
}

/* responsive tweak */
@media (max-width:640px){
  .roleCard{ padding:18px 18px; border-radius:26px; }
  .roleName{ font-size:26px; }
  .rolePill{ font-size:22px; min-width:140px; padding:12px 16px; border-radius:14px; border-width:3px; }
  .roleIcon{ width:40px; height:40px; }
}


        </style>
    </head>
    <body>
<div class="roleCard">
  <div class="roleLeft">
    <span class="roleIcon" aria-hidden="true">
      <!-- simple outline user icon -->
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M12 12a4.5 4.5 0 1 0-4.5-4.5A4.5 4.5 0 0 0 12 12Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M4.5 20.5c1.9-3.6 5-5.5 7.5-5.5s5.6 1.9 7.5 5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </span>

    <span id="roleUser" class="roleName">User 4</span>
  </div>

  <span id="roleBadge" class="rolePill is-viewer">Viewer</span>
</div>

    </body>
</html>
